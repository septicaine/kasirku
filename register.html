<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evergreen</title>
    <!-- Google Fonts: Inter / Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            padding: 24px 40px;
        }

        /* Bagian Header Logo */
        header {
            display: flex;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            color: #111827;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background-color: #1e4d3b; /* Warna hijau tua khas Evergreen */
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        /* Konten Utama / Form Card */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px 0;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            margin-bottom: 24px;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 14px;
            color: #6b7280;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #1f2937;
        }

        .form-group input:focus {
            border-color: #1e4d3b;
            box-shadow: 0 0 0 3px rgba(30, 77, 59, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        /* Ikon mata untuk password */
        .password-toggle {
            position: absolute;
            right: 14px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
        }

        /* Tombol Daftar Utama */
        .btn-submit {
            width: 100%;
            background-color: #1e4d3b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: #15382b;
        }

        /* Pemisah "ATAU" */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #9ca3af;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .divider span {
            padding: 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tombol Daftar dengan Google */
        .btn-google {
            width: 100%;
            background-color: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .btn-google:hover {
            background-color: #f9fafb;
        }

        .btn-google {
            width: 100%;
            background-color: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-google:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
        }

        /* Tautan Masuk */
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }

        .login-link a {
            color: #1e4d3b;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Bagian Footer Bawah */
        footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

    </style>
</head>
<body>

    <!-- Header / Logo -->
    <header>
        <div class="brand-logo">
            <div class="brand-icon">
                <i class="fa-solid fa-seedling"></i>
            </div>
            <span>Evergreen</span>
        </div>
    </header>

    <!-- Konten Form Buat Akun -->
    <main>
        <div class="card">
            <div class="card-header">
                <h1>Buat Akun</h1>
                <p>Mulai kelola bisnis Anda dengan lebih rapi.</p>
            </div>

            <form>
                <div class="form-group">
                    <label for="nama">Nama lengkap</label>
                    <input type="text" id="nama" placeholder="Ayu Rahma">
                </div>

                <div class="form-group">
                    <label for="email">Alamat email</label>
                    <input type="email" id="email" placeholder="nama@gmail.com">
                </div>

                <div class="form-group">
                    <label for="sandi">Kata sandi</label>
                    <div class="input-container">
                        <!-- value "rahasia123" dihapus supaya kosong, dan tambahkan id unik -->
                        <input type="password" id="sandi" placeholder="Masukkan kata sandi">
                        <!-- Tambahkan id pada ikon mata -->
                        <i class="fa-regular fa-eye-slash password-toggle" id="toggleSandi"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="konfirmasi-sandi">Konfirmasi kata sandi</label>
                    <div class="input-container">
                        <!-- value "rahasia123" dihapus, dan tambahkan id unik -->
                        <input type="password" id="konfirmasi-sandi" placeholder="Ulangi kata sandi">
                        <!-- Tambahkan id pada ikon mata -->
                        <i class="fa-regular fa-eye-slash password-toggle" id="toggleKonfirmasiSandi"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Daftar</button>
            </form>

            <div class="divider">
                <span>atau</span>
            </div>

            <!-- Tombol Daftar dengan Google -->
            <button type="button" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.63-.05-1.25-.15-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.96c1.73-1.59 2.73-3.93 2.73-6.62z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.26c-.82.55-1.87.9-3 .9-2.31 0-4.27-1.56-4.97-3.65H1.01v2.33C2.51 15.96 5.54 18 9 18z" fill="#34A853"/>
                    <path d="M4.03 10.81c-.18-.55-.28-1.13-.28-1.71s.1-1.16.28-1.71V5.06H1.01C.37 6.35 0 7.8 0 9.3s.37 2.95 1.01 4.24l3.02-2.73z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.54 0 2.51 2.04 1.01 5.06l3.02 2.33c.7-2.09 2.66-3.81 4.97-3.81z" fill="#EA4335"/>
                </svg>
                Daftar dengan Google
            </button>

            <div class="login-link">
                Sudah punya akun? <a href="login.html">Masuk</a>
            </div>
        </div>
    </main>

    <!-- Footer Bawah -->
    <footer>
        <p>Dengan melanjutkan, Anda menyetujui Ketentuan Layanan dan Kebijakan Privasi kami.</p>
    </footer>

    <script>
        // Toggle visibility for password fields
        const toggleSandi = document.getElementById('toggleSandi');
        const sandiInput = document.getElementById('sandi');

        toggleSandi.addEventListener('click', () => {
            const type = sandiInput.getAttribute('type') === 'password' ? 'text' : 'password';
            sandiInput.setAttribute('type', type);
            toggleSandi.classList.toggle('fa-eye');
            toggleSandi.classList.toggle('fa-eye-slash');
        });

        const toggleKonfirmasiSandi = document.getElementById('toggleKonfirmasiSandi');
        const konfirmasiSandiInput = document.getElementById('konfirmasi-sandi');

        toggleKonfirmasiSandi.addEventListener('click', () => {
            const type = konfirmasiSandiInput.getAttribute('type') === 'password' ? 'text' : 'password';
            konfirmasiSandiInput.setAttribute('type', type);
            toggleKonfirmasiSandi.classList.toggle('fa-eye');
            toggleKonfirmasiSandi.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
