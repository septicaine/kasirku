<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evergreen</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            padding: 24px 40px;
        }

        /* Bagian Header Logo */
        header {
            display: flex;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            color: #111827;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background-color: #1e4d3b; /* Hijau tua khas Evergreen */
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        /* Konten Utama / Form Card */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px 0;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            margin-bottom: 24px;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 14px;
            color: #6b7280;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #1f2937;
        }

        .form-group input:focus {
            border-color: #1e4d3b;
            box-shadow: 0 0 0 3px rgba(30, 77, 59, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        /* Hapus ikon mata bawaan browser */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear,
        input[type="password"]::-webkit-contacts-auto-fill-button,
        input[type="password"]::-webkit-credentials-auto-fill-button {
            display: none !important;
            width: 0;
            height: 0;
        }

        /* Ikon mata untuk password */
        .password-toggle {
            position: absolute;
            right: 14px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
            z-index: 10;
            user-select: none;
        }

        .password-toggle:hover {
            color: #374151;
        }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #1e4d3b;
            text-decoration: none;
            margin-top: 6px;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Tombol Sign In Utama */
        .btn-submit {
            width: 100%;
            background-color: #1e4d3b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: #15382b;
        }

        /* Tautan ke Register */
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }

        .register-link a {
            color: #1e4d3b;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Footer Bawah */
        footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <!-- Header / Logo -->
    <header>
        <div class="brand-logo">
            <div class="brand-icon">
                <i class="fa-solid fa-seedling"></i>
            </div>
            <span>Evergreen</span>
        </div>
    </header>

    <!-- Konten Form Login -->
    <main>
        <div class="card">
            <div class="card-header">
                <h1>Selamat datang kembali</h1>
                <p>Masuk untuk melanjutkan ke aplikasi.</p>
            </div>

            <form action="index.html" method="GET">
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="nama@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="input-container">
                        <input type="password" id="password" placeholder="Masukkan kata sandi" required>
                        <i class="fa-regular fa-eye-slash password-toggle" id="togglePassword"></i>
                    </div>
                    <a href="lupa_sandi.html" class="forgot-password">Lupa kata sandi?</a>
                </div>

                <button type="submit" class="btn-submit">Masuk</button>
            </form>

            <div class="register-link">
                Belum punya akun? <a href="register.html">Buat akun</a>
            </div>
        </div>
    </main>

    <!-- Footer Bawah -->
    <footer>
        <p>Dengan melanjutkan, Anda menyetujui Ketentuan Layanan dan Kebijakan Privasi kami.</p>
    </footer>

    <!-- Script untuk Toggle Lihat/Sembunyikan Sandi -->
    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function (e) {
            e.preventDefault();
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
